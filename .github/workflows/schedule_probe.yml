name: Schedule probe

run-name: Schedule probe - ${{ github.event_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Record scheduled trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          date -u
