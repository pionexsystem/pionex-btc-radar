name: Publish BTC radar data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/latest.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare public site
        run: |
          mkdir -p public
          cp data/latest.json public/latest.json

          python - <<'PY'
          from pathlib import Path
          import html

          data = Path("data/latest.json").read_text(encoding="utf-8")
          escaped = html.escape(data)

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Pionex BTC Radar Data</title>
          </head>
          <body>
            <h1>Pionex BTC Radar Data</h1>
            <p>Current output of the automated BTC radar collector.</p>
            <pre>{escaped}</pre>
          </body>
          </html>
          """

          Path("public/index.html").write_text(page, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
