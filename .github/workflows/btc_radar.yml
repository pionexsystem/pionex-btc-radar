name: Daily BTC data collector

on:
  workflow_dispatch:
  schedule:
  - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-radar-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run collector
        id: collector
        shell: bash
        run: |
          set +e
          python collector.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Collector exit code: $code"
          exit 0

      - name: Commit generated data
        shell: bash
        run: |
          if [ ! -d data ]; then
            echo "No data directory was created."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update BTC radar data"
            git push
          fi

      - name: Report collector failure
        if: steps.collector.outputs.exit_code != '0'
        run: |
          echo "::warning::Collector ended with FAILED status. The failure log was saved in data/."
